<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Omajuwa Okotie, DevSecOps and Cloud Security Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.5s; }
    .l4 { animation-delay: 2.1s; } .l5 { animation-delay: 2.7s; } .l6 { animation-delay: 3.3s; }
    @keyframes show { to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c2330" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="260" rx="12" fill="url(#bg)"/>
  <rect width="900" height="260" rx="12" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="12" fill="none" stroke="#263042"/>

  <!-- window bar -->
  <circle cx="24" cy="22" r="5" fill="#ff5f57"/><circle cx="42" cy="22" r="5" fill="#febc2e"/><circle cx="60" cy="22" r="5" fill="#28c840"/>
  <text x="450" y="26" text-anchor="middle" class="mono" font-size="12" fill="#6e7683">omajuwa@devsecops: ~</text>
  <line x1="0" y1="40" x2="900" y2="40" stroke="#263042"/>

  <!-- left: name -->
  <text x="40" y="104" class="sans" font-size="44" font-weight="800" fill="#e8eaef" letter-spacing="1">OMAJUWA OKOTIE</text>
  <text x="40" y="136" class="sans" font-size="18" font-weight="600" fill="#f0a83a">DevSecOps &amp; Cloud Security Engineer</text>
  <text x="40" y="164" class="mono" font-size="13" fill="#a7aeba">Secure CI/CD  ·  AWS &amp; Azure  ·  Kubernetes  ·  AppSec</text>
  <rect x="40" y="186" width="210" height="28" rx="14" fill="#0f2a1f" stroke="#34d399"/>
  <circle cx="58" cy="200" r="5" fill="#34d399" class="cursor"/>
  <text x="72" y="205" class="mono" font-size="12" fill="#34d399">open to work · London</text>

  <!-- right: terminal -->
  <rect x="520" y="58" width="350" height="180" rx="8" fill="#080a0e" stroke="#263042"/>
  <g class="mono" font-size="12.5" xml:space="preserve">
    <text x="536" y="84" class="l l1" fill="#a7aeba"><tspan fill="#f0a83a">$</tspan> ./pipeline --gate=blocking</text>
    <text x="536" y="108" class="l l2" fill="#e8eaef"><tspan fill="#34d399">✔</tspan><tspan x="556">gitleaks</tspan><tspan x="652">no secrets</tspan></text>
    <text x="536" y="130" class="l l3" fill="#e8eaef"><tspan fill="#34d399">✔</tspan><tspan x="556">checkov</tspan><tspan x="652">72 → 0 findings</tspan></text>
    <text x="536" y="152" class="l l4" fill="#e8eaef"><tspan fill="#34d399">✔</tspan><tspan x="556">trivy</tspan><tspan x="652">25 → 0 CVEs</tspan></text>
    <text x="536" y="174" class="l l5" fill="#e8eaef"><tspan fill="#34d399">✔</tspan><tspan x="556">sonarqube</tspan><tspan x="652">86.3% coverage</tspan></text>
    <text x="536" y="202" class="l l6" fill="#f0a83a">→ promoted to prod by SHA</text>
    <rect x="536" y="212" width="8" height="14" fill="#f0a83a" class="cursor"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
